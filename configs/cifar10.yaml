experiment_name: cifar10_cnn9_residual_eca

dataset:
  name: cifar10
  batch_size: 64
  data_dir: ./data
  input_channels: 3
  num_classes: 10

model:
  name: cnn
  activation: relu
  dropout: 0.2

  # One ConvBlock + four ResidualBlocks (two convs each) = 9 conv layers.
  # ECA adds lightweight channel attention without changing feature dimensions.
  # stride: 2 halves the spatial width and height.
  architecture:
    - type: conv
      out_channels: 64
      kernel_size: 3
      stride: 1
    - type: residual
      out_channels: 64
      kernel_size: 3
      stride: 1
    - type: residual
      out_channels: 128
      kernel_size: 3
      stride: 2
    - type: residual
      out_channels: 256
      kernel_size: 3
      stride: 2
    - type: residual
      out_channels: 256
      kernel_size: 3
      stride: 1
    - type: eca
      kernel_size: 3

training:
  epochs: 25
  learning_rate: 0.001
  weight_decay: 0.0005

checkpoint:
  save_dir: checkpoints
  save_best: true
