experiment_name: cifar10_cnn5_residual

dataset:
  name: cifar10
  batch_size: 64
  data_dir: ./data
  input_channels: 3
  num_classes: 10

model:
  name: cnn
  activation: relu
  dropout: 0.2

  # Three ConvBlocks + two convolutions inside the ResidualBlock = 5 conv layers.
  # stride: 2 replaces a separate pooling layer and halves width/height.
  architecture:
    - type: conv
      out_channels: 64
      kernel_size: 3
      stride: 1
    - type: conv
      out_channels: 64
      kernel_size: 3
      stride: 2
    - type: conv
      out_channels: 128
      kernel_size: 3
      stride: 2
    - type: residual
      out_channels: 128
      kernel_size: 3
      stride: 1

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0005

checkpoint:
  save_dir: checkpoints
  save_best: true
