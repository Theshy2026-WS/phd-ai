experiment_name: cifar100_cnn9_residual_eca

dataset:
  name: cifar100
  batch_size: 64
  data_dir: ./data
  download: true
  image_size: 32
  input_channels: 3
  num_classes: 100

model:
  name: cnn
  activation: relu
  dropout: 0.2
  architecture:
    - type: conv
      out_channels: 64
      kernel_size: 3
      stride: 1
    - type: residual
      out_channels: 64
      kernel_size: 3
      stride: 1
    - type: residual
      out_channels: 128
      kernel_size: 3
      stride: 2
    - type: residual
      out_channels: 256
      kernel_size: 3
      stride: 2
    - type: residual
      out_channels: 256
      kernel_size: 3
      stride: 1
    - type: eca
      kernel_size: 3

training:
  epochs: 25
  learning_rate: 0.001
  weight_decay: 0.0005

checkpoint:
  save_dir: checkpoints
  save_best: true
