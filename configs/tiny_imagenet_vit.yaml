experiment_name: tiny_imagenet_vit_baseline

dataset:
  name: tiny_imagenet
  batch_size: 64
  data_dir: ./data
  download: true
  image_size: 64
  input_channels: 3
  num_classes: 200
  evaluation_split: development
  validation_fraction: 0.1
  split_seed: 42
  num_workers: 4

model:
  name: vit
  image_size: 64
  patch_size: 4
  embed_dim: 224
  depth: 5
  num_heads: 4
  mlp_ratio: 4.0
  dropout: 0.1
  attention_dropout: 0.0

training:
  epochs: 5
  learning_rate: 0.0005
  weight_decay: 0.05
  label_smoothing: 0.1
  seed: 42
  mixed_precision: true
  amp_dtype: float16
  enable_tf32: true
  deterministic: false
  scheduler:
    name: cosine
    warmup_epochs: 1
    warmup_start_factor: 0.1
    min_lr: 0.00001

profiling:
  enabled: true
  inference_batch_size: 64
  warmup_iterations: 20
  benchmark_iterations: 100

checkpoint:
  save_dir: checkpoints
  save_best: true
